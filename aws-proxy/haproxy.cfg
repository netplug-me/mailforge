# TCP passthrough for IMAPS / SMTPS / submission to the mailserver, reached over WARP.
# TLS is NOT terminated here: the mailserver's Let's Encrypt cert for mail.<domain> is presented
# to clients unchanged. Never add 25 or 143 (see aws-proxy/README.md).
global
    log /dev/log local0
    maxconn 4096

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 10s
    # IMAP IDLE connections sit idle for ~29 minutes; shorter timeouts break push.
    timeout client 35m
    timeout server 35m
    timeout client-fin 30s

# One shared per-source table. The mailserver sees every remote login from cloudflared's address
# (fail2ban ignores it), so this is the only brute-force brake: tune the limits to taste.
# Mobile carriers NAT many users behind one IP, so keep them generous.
backend st_src
    stick-table type ip size 100k expire 10m store conn_rate(1m),conn_cur

frontend imaps
    bind :993
    tcp-request connection track-sc0 src table st_src
    tcp-request connection reject if { sc0_conn_rate gt 30 } || { sc0_conn_cur gt 20 }
    default_backend mail_imaps

frontend smtps
    bind :465
    tcp-request connection track-sc0 src table st_src
    tcp-request connection reject if { sc0_conn_rate gt 30 } || { sc0_conn_cur gt 20 }
    default_backend mail_smtps

frontend submission
    bind :587
    tcp-request connection track-sc0 src table st_src
    tcp-request connection reject if { sc0_conn_rate gt 30 } || { sc0_conn_cur gt 20 }
    default_backend mail_submission

# The mailserver listens for PROXY protocol v2 on 10993/10465/10587 (aws-proxy/dms/) and trusts the header
# only from cloudflared, so its logs and per-IP limits see the real client address. check-send-proxy makes the
# health checks speak it too (a bare connect would be logged as a protocol error every 30s).
backend mail_imaps
    server mailserver 172.25.0.10:10993 send-proxy-v2 check check-send-proxy inter 30s

backend mail_smtps
    server mailserver 172.25.0.10:10465 send-proxy-v2 check check-send-proxy inter 30s

backend mail_submission
    server mailserver 172.25.0.10:10587 send-proxy-v2 check check-send-proxy inter 30s
